[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.3.0"
requires-python = ">=3.11"
description = "Daily job search, CV tailoring, and digest email."
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "claude-agent-sdk>=0.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"` for the test suite. Kept here rather than in a
# requirements.txt so there is one source of truth for what this needs.
dev = ["pytest>=8.0"]

[project.scripts]
# The scheduled task invokes this executable by absolute path — a
# non-interactive session does not inherit the interactive PATH.
jobs = "jobsearch.delivery.cli:main"

[tool.setuptools.packages.find]
# src-layout: one real package, `jobsearch`, with subpackages. Not flat modules
# on sys.path — `config`, `tools`, `jobs` and `db` are far too generic to own at
# top level, where an installed distribution could shadow them.
where = ["src"]
include = ["jobsearch*"]

[tool.pytest.ini_options]
# src/ on the path so tests resolve `jobsearch` the same way the installed
# package does.
pythonpath = ["src"]
testpaths = ["tests"]
