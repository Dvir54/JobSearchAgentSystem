services:
  db:
    image: postgres:16
    container_name: jobsearch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      # 127.0.0.1 only. Never 0.0.0.0 — this database holds the full job history
      # and there is no reason for anything off this machine to reach it.
      #
      # Host port 5433, not 5432: this machine already runs a native
      # PostgreSQL 18 service (postgresql-x64-18) that owns 5432. Taking it would
      # mean stopping an install this project knows nothing about.
      - "127.0.0.1:5433:5432"
    volumes:
      - jobsearch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  jobsearch-pgdata:
